name: Build LGA Desktop Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore LGA.Desktop/LGA.Desktop.csproj

    - name: Build Application
      run: dotnet build LGA.Desktop/LGA.Desktop.csproj --configuration Release --no-restore

    - name: Publish Executable
      run: dotnet publish LGA.Desktop/LGA.Desktop.csproj -c Release -r win-x64 --self-contained false -o ./publish

    - name: Upload Built Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LGA-Desktop-Executable
        path: ./publish/*
